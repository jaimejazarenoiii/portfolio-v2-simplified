<nav class="nav" role="navigation" aria-label="Main">
  <div class="container nav__inner">
    <a href="{{ '/' | prepend: site.baseurl }}" class="nav__logo">
      <span class="nav__logo-dot"></span>
      {{ site.title }}
    </a>

    <ul class="nav__links">
      <li><a href="{{ '/' | prepend: site.baseurl }}" class="nav__link">Home</a></li>
      <li><a href="{{ '/resume' | prepend: site.baseurl }}" class="nav__link">Resume</a></li>
      <li><a href="{{ '/blog' | prepend: site.baseurl }}" class="nav__link">Blog</a></li>
    </ul>

    <ul class="nav__social">
      {% if site.author.github %}
      <li>
        <a href="https://github.com/{{ site.author.github }}" class="nav__social-link" target="_blank" rel="noopener" aria-label="GitHub">
          <i class="fa-brands fa-github"></i>
        </a>
      </li>
      {% endif %}
      {% if site.author.linkedin %}
      <li>
        <a href="https://in.linkedin.com/in/{{ site.author.linkedin }}" class="nav__social-link" target="_blank" rel="noopener" aria-label="LinkedIn">
          <i class="fa-brands fa-linkedin"></i>
        </a>
      </li>
      {% endif %}
      {% if site.author.email %}
      <li>
        <a href="mailto:{{ site.author.email }}" class="nav__social-link" aria-label="Email">
          <i class="fa-solid fa-envelope"></i>
        </a>
      </li>
      {% endif %}
    </ul>

    <button class="nav__toggle" aria-label="Toggle menu" aria-expanded="false">
      <i class="fa-solid fa-bars"></i>
    </button>
  </div>
</nav>
